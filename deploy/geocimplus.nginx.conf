# Inspect the actual Nginx installation and back up its site configuration before enabling.
server {
    listen 80;
    server_name geocimplus.com www.geocimplus.com;
    root /www/wwwroot/geocimplus/current;
    index index.html;
    server_tokens off;
    gzip on;
    gzip_types application/javascript application/json text/css;
    gzip_vary on;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;
    location ^~ /.well-known/acme-challenge/ { root /www/wwwroot/geocimplus/acme; }
    location ~ /\. { deny all; }
    location /api/ {
        limit_except GET { deny all; }
        default_type application/json;
        add_header Cache-Control no-store;
        try_files $uri =404;
    }
    location /assets/ { try_files $uri =404; expires 7d; }
    location = /index.html { add_header Cache-Control no-cache; }
    location / { try_files $uri $uri/ =404; }
}
